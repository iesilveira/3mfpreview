services:
  forma-3mf:
    build: .
    ports:
      - "3001:3001"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      DATA_DIR: /app/data
      PORT: 3001
    volumes:
      - ./data:/app/data
    restart: unless-stopped
